# Cut a release: build on every desktop platform, then publish one GitHub
# release with checksums.
#
# This is the ONLY path that produces a macOS build. Windows and Linux both
# cross-build from a Linux box (`scripts/build-windows.sh`), and that is the
# fast local loop — but macOS needs the Apple SDK, and a .app that has not been
# signed and notarised on a real macOS runner is one Gatekeeper refuses to open
# without a right-click dance. See docs/BUILDING.md.
name: release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build and publish (e.g. v0.2.0)'
                required: true

permissions:
    contents: write
    packages: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      name: linux
                      args: '--bundles appimage,deb'
                    - os: windows-latest
                      name: windows
                      args: '--bundles nsis,msi'
                    # Both architectures in one binary — an Apple Silicon-only
                    # build is a support ticket from every 2019 MacBook.
                    - os: macos-latest
                      name: macos
                      args: '--target universal-apple-darwin --bundles dmg,app'
        runs-on: ${{ matrix.os }}
        steps:
            # A manual run names the tag to build; without this it would build
            # the default branch and publish the result under that tag.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com
                  scope: '@modcommunity'

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Linux build dependencies
              if: matrix.name == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                    libsoup-3.0-dev libgtk-3-dev libdbus-1-dev \
                    librsvg2-dev libxdo-dev patchelf file

            # `@modcommunity/shared` lives in GitHub Packages. GITHUB_TOKEN can
            # read it when the package grants this repository access; where it
            # does not, PACKAGES_TOKEN is a PAT with `read:packages`.
            - name: Install
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

            # THE SIGNING KEY DECIDES WHETHER THIS RELEASE CAN BE INSTALLED
            # BY THE APP ITSELF.
            #
            # `createUpdaterArtifacts` is off in `tauri.conf.json` and turned on
            # here instead, because with it on and no key `tauri build` fails —
            # which would break `npm run desktop:build` for everybody who does
            # not have one. So it is enabled exactly when both halves are
            # present, and its absence is a warning rather than a failure: a
            # release nobody can auto-update is still a release people can
            # download, and failing the build would mean no release at all.
            #
            # TMC_UPDATER_PUBKEY is a repository VARIABLE, not a secret. It is a
            # public key; storing it as a secret would only mean nobody can read
            # back what a build was signed against.
            - name: Build
              shell: bash
              env:
                  TMC_UPDATER_PUBKEY: ${{ vars.TMC_UPDATER_PUBKEY }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  extra=()

                  if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TMC_UPDATER_PUBKEY:-}" ]; then
                      extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
                      echo "Signing updater artifacts."
                  else
                      echo "::warning::No updater key configured (needs the TMC_UPDATER_PUBKEY variable AND the TAURI_SIGNING_PRIVATE_KEY secret). This release will be download-only — the app will show its banner and open the download page rather than installing."
                  fi

                  npx tauri build ${{ matrix.args }} "${extra[@]}"

            # The `.sig` files ride along with the artifacts, and the macOS
            # updater bundle is the `.app.tar.gz` rather than the `.dmg` — a
            # DMG is a disk image a person mounts, not something an updater can
            # unpack over a running app.
            #
            # They are published on the release so `publish-app-release.ts`
            # can be pointed at one with `--sig-file`. A signature is not a
            # secret: it proves who built the artifact, and it is useless
            # without the artifact it signs.
            - name: Collect
              shell: bash
              run: |
                  mkdir -p out
                  find src-tauri/target -type f \
                    \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                       -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' \
                       -o -name '*.app.tar.gz' -o -name '*.sig' \) \
                    -exec cp {} out/ \;
                  ls -la out

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: out/*
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            # Pinned rather than relying on the runner image's default, since
            # `publish-release.mjs` uses `fetch` and top-level `await`.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # checksums.txt is not decoration: `scripts/install.sh` REFUSES to
            # install without it, so a release published without this step is a
            # release the one-line installer will not touch.
            #
            # The `.sig` files are excluded from it. They are not things anybody
            # installs, and a checksum of a signature is a hash of a hash.
            - name: Checksums
              working-directory: artifacts
              run: |
                  sha256sum $(ls | grep -v '\.sig$') > checksums.txt
                  cat checksums.txt

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  gh release create "$TAG" --title "TMC $TAG" --generate-notes --draft=false \
                    || echo "release already exists, uploading into it"
                  gh release upload "$TAG" artifacts/* --clobber

            # PUBLISHING THE RELEASE TO THE SITE IS PART OF CUTTING IT.
            #
            # Without this, every release ended with somebody running a script
            # once per platform and then remembering to promote — three chances
            # to get it wrong on the one workflow where getting it wrong means
            # telling users about an update and handing them a 404.
            #
            # It runs AFTER the GitHub release exists, because the URLs it
            # publishes are that release's download URLs: sending them first
            # would name files nothing serves yet. One request carries every
            # platform and the promotion together, so the site writes them in
            # one transaction or writes none.
            #
            # It is skipped, loudly, when the secret is unset. A release that
            # was cut and not announced is a state somebody can fix in a minute;
            # a failed release job is one that has to be re-run against a tag
            # that already has artifacts on it.
            - name: Publish to TMC
              shell: bash
              env:
                  TMC_RELEASE_TOKEN: ${{ secrets.TMC_RELEASE_TOKEN }}
                  TMC_SITE_URL: ${{ vars.TMC_SITE_URL }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  if [ -z "${TMC_RELEASE_TOKEN:-}" ]; then
                      echo "::warning::TMC_RELEASE_TOKEN is not set, so this release was not published to the site. Nobody is offered it until it is — run scripts/publish-release.mjs by hand, or set the secret and re-run this job."
                      exit 0
                  fi

                  if ! ls artifacts/*.sig >/dev/null 2>&1; then
                      echo "::warning::This release is unsigned, so the app cannot install it. Not publishing to the site — the version banner will still offer the download page."
                      exit 0
                  fi

                  # An ARRAY, not `${VAR:+--site "$VAR"}`. That expansion
                  # word-splits without re-interpreting the quotes, so the URL
                  # would arrive with literal quote characters around it.
                  # Unset means the production site, which is what the script
                  # defaults to. The variable exists so a fork or a staging
                  # deployment can point its own releases somewhere else.
                  site=()

                  if [ -n "${TMC_SITE_URL:-}" ]; then
                      site=(--site "$TMC_SITE_URL")
                  fi

                  node scripts/publish-release.mjs \
                      --dir artifacts \
                      --version "${TAG#v}" \
                      --base-url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
                      "${site[@]}" \
                      --promote
