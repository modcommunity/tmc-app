# Cut a release: build on every desktop platform plus Android and iOS, then
# publish one GitHub release with checksums.
#
# This is the ONLY path that produces a macOS build. Windows and Linux both
# cross-build from a Linux box (`scripts/build-windows.sh`), and that is the
# fast local loop — but macOS needs the Apple SDK and a real macOS runner.
#
# THE macOS BUILD IS UNSIGNED AND NOT NOTARISED: no APPLE_* secrets are passed
# to `tauri build` below, so Gatekeeper refuses to open it without a
# right-click → Open. Code signing and notarisation arrive when the APPLE_*
# signing secrets are added to the Build step. See docs/BUILDING.md.
name: release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build and publish (e.g. v0.2.0)'
                required: true

permissions:
    contents: write
    packages: read

# ONE Rust toolchain for CI and releases, pinned rather than `stable`.
#
# A new stable ships new clippy lints, and `-D warnings` turns each into an
# error — so an unpinned toolchain can fail a release tag on code that passed
# review the day before (1.98's `question_mark` did exactly that). Bumping is a
# one-line change here AND in the other workflow, made on a branch, so the new
# lints fail a pull request first rather than a tag.
env:
    RUST_TOOLCHAIN: '1.98'

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      name: linux
                      args: '--bundles appimage,deb'
                    - os: windows-latest
                      name: windows
                      args: '--bundles nsis,msi'
                    # Both architectures in one binary — an Apple Silicon-only
                    # build is a support ticket from every 2019 MacBook.
                    - os: macos-latest
                      name: macos
                      args: '--target universal-apple-darwin --bundles dmg,app'
        runs-on: ${{ matrix.os }}
        steps:
            # A manual run names the tag to build; without this it would build
            # the default branch and publish the result under that tag.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            # THE TAG MUST BE THE VERSION THE BINARY REPORTS.
            #
            # `latest.json` takes its version from the tag, but the app reports
            # `tauri.conf.json`'s. A tag pushed without the bump publishes a
            # manifest saying 0.3.0 over a binary that still says 0.1.0: every
            # installed app installs it, still reports 0.1.0, and is offered
            # the same update again forever. Refused here, before any build.
            - name: Tag matches tauri.conf.json
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  if [ "${TAG#v}" != "$conf" ]; then
                      echo "::error::Tag $TAG is not the version in src-tauri/tauri.conf.json ($conf). Bump it (and package.json, src-tauri/Cargo.toml), commit, and tag that commit."
                      exit 1
                  fi

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com
                  scope: '@modcommunity'

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Linux build dependencies
              if: matrix.name == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                    libsoup-3.0-dev libgtk-3-dev libdbus-1-dev \
                    librsvg2-dev libxdo-dev patchelf file

            # `@modcommunity/shared` lives in GitHub Packages. GITHUB_TOKEN can
            # read it when the package grants this repository access; where it
            # does not, PACKAGES_TOKEN is a PAT with `read:packages`.
            - name: Install
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

            # THE SIGNING KEY DECIDES WHETHER THIS RELEASE CAN BE INSTALLED
            # BY THE APP ITSELF.
            #
            # `createUpdaterArtifacts` is off in `tauri.conf.json` and turned on
            # here instead, because with it on and no key `tauri build` fails —
            # which would break `npm run desktop:build` for everybody who does
            # not have one. So it is enabled exactly when the private key is
            # present, and its absence is a warning rather than a failure: a
            # release nobody can auto-update is still a release people can
            # download, and failing the build would mean no release at all.
            #
            # The PUBLIC key is `src-tauri/updater.pub`, compiled in by
            # `build.rs`; the `TMC_UPDATER_PUBKEY` variable overrides it for a
            # fork signing with its own pair. The two halves must match — a
            # mismatch is a release every installed app refuses after the
            # download, so it is checked below before anything is built.
            #
            # TMC_UPDATER_ENDPOINT is the public `latest.json` compiled in as
            # the updater's default, so a release updates with nothing on the
            # site. In order: the variable when set; the downloads bucket's
            # switch when S3_PUBLIC_URL is set; otherwise the `latest.json`
            # the Publish step attaches to this repository's newest release
            # (`releases/latest/download/latest.json`), which GitHub serves
            # without any configuration.
            - name: Build
              shell: bash
              env:
                  TMC_UPDATER_PUBKEY: ${{ vars.TMC_UPDATER_PUBKEY }}
                  TMC_UPDATER_ENDPOINT: ${{ vars.TMC_UPDATER_ENDPOINT }}
                  S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL || secrets.S3_PUBLIC_URL }}
                  REPO: ${{ github.repository }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  extra=()

                  if [ -z "${TMC_UPDATER_ENDPOINT:-}" ] && [ -n "${S3_PUBLIC_URL:-}" ]; then
                      export TMC_UPDATER_ENDPOINT="${S3_PUBLIC_URL%/}/downloads/gamespice-app/latest.json"
                  fi
                  if [ -z "${TMC_UPDATER_ENDPOINT:-}" ]; then
                      export TMC_UPDATER_ENDPOINT="https://github.com/${REPO}/releases/latest/download/latest.json"
                  fi
                  echo "Updater endpoint: ${TMC_UPDATER_ENDPOINT}"

                  if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
                      # The CLI decodes plugins.updater.pubkey when it signs, and
                      # tauri.conf.json leaves it empty on purpose (the app reads
                      # its key from build.rs), so hand it the same key here.
                      pub="${TMC_UPDATER_PUBKEY:-$(tr -d '\r\n' < src-tauri/updater.pub)}"
                      cfg="$(PUB="$pub" node -e 'console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUB}}}))')"
                      extra=(--config "$cfg")
                      echo "Signing updater artifacts."
                  else
                      echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret, so this release is unsigned and download-only: installed apps will show the banner and open the download page rather than installing. See docs/RELEASING.md."
                  fi

                  npx tauri build ${{ matrix.args }} "${extra[@]}"

                  # A signature the compiled-in key cannot verify is caught
                  # here rather than by every user after a download.
                  if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
                      node scripts/verify-updater-signature.mjs src-tauri/target
                  fi

            # WINDOWS ALSO SHIPS THE BARE EXE, AND NO BUNDLER PRODUCES IT.
            #
            # A Tauri app is one file — the webview comes from Windows — so the
            # binary the compile already made runs on its own, and that is what
            # somebody who does not want an installer is handed. README.md has
            # offered it since before this workflow existed; without this step
            # the releases it points at have only the two installers in them.
            #
            # The name is DERIVED from the NSIS output rather than rebuilt out
            # of `tauri.conf.json`, so the product name, the version and the
            # bundler's own spelling of the architecture cannot drift apart —
            # the same reason `publish-release.mjs` is a script with a table in
            # it rather than a glob in this file.
            #
            # `-portable.exe` also keeps it out of that table: the Windows rules
            # match `-setup.exe` and `.msi`, so the updater is never offered a
            # file that installs nothing and registers no `gs://` scheme.
            - name: Portable exe
              if: matrix.name == 'windows'
              shell: bash
              run: |
                  out=src-tauri/target/release
                  setup="$(ls "$out"/bundle/nsis/*-setup.exe 2>/dev/null | head -1)"

                  if [ -z "$setup" ]; then
                      echo "::error::No NSIS setup under $out/bundle/nsis, so there is nothing to name the portable exe after."
                      exit 1
                  fi

                  # The cargo binary is named after the crate and the file
                  # people are handed is named after the product — the same
                  # rename `build-windows.sh` does on the cross-build path.
                  # The fallback is for the day Tauri starts renaming it
                  # itself, which would otherwise fail the whole release job
                  # over a file that is sitting right there under a new name.
                  exe="$out/gamespice-app.exe"
                  [ -f "$exe" ] || exe="$(ls "$out"/*.exe 2>/dev/null | head -1)"

                  if [ -z "$exe" ] || [ ! -f "$exe" ]; then
                      echo "::error::No application exe under $out."
                      exit 1
                  fi

                  mkdir -p "$out/bundle/portable"
                  cp "$exe" "$out/bundle/portable/$(basename "${setup%-setup.exe}")-portable.exe"
                  ls -la "$out/bundle/portable"

            # The `.sig` files ride along with the artifacts, and the macOS
            # updater bundle is the `.app.tar.gz` rather than the `.dmg` — a
            # DMG is a disk image a person mounts, not something an updater can
            # unpack over a running app.
            #
            # They are published on the release so `publish-app-release.ts`
            # can be pointed at one with `--sig-file`. A signature is not a
            # secret: it proves who built the artifact, and it is useless
            # without the artifact it signs.
            - name: Collect
              shell: bash
              run: |
                  mkdir -p out
                  find src-tauri/target -type f \
                    \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                       -o -name '*-setup.exe' -o -name '*-portable.exe' \
                       -o -name '*.msi' -o -name '*.dmg' \
                       -o -name '*.app.tar.gz' -o -name '*.sig' \) \
                    -exec cp {} out/ \;

                  # Tauri names bundles after productName, space and all
                  # ("GameSpice App_0.3.0_x64-setup.exe"). A space in a release
                  # asset becomes a dot on GitHub and %20 everywhere else, so
                  # every artifact (and its .sig, which must keep the same
                  # stem) is published as `GameSpice-App_*`.
                  for f in out/*' '*; do
                      [ -e "$f" ] || continue
                      mv "$f" "out/$(basename "$f" | tr ' ' '-')"
                  done
                  ls -la out

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: out/*
                  if-no-files-found: error

    # ANDROID AND iOS: the same tag, built from a freshly generated project.
    #
    # `src-tauri/gen/` is not committed. `tauri android init` / `tauri ios init`
    # write it, `scripts/mobile-patch.mjs` adds the `gs://` and `tmc://` schemes
    # (read from tauri.conf.json) and the committed icons, and a check after
    # the build refuses an artifact that does not declare them. The outputs are
    # NOT updater artifacts (no `.sig`), so they never reach `latest.json`, the
    # site publish or the desktop jobs: they are plain release files with a
    # line in checksums.txt. A failed mobile job does not stop the desktop
    # release from publishing (see `publish`'s `if`).
    android:
        runs-on: ubuntu-22.04
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
            NDK_VERSION: '27.2.12479018'
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Tag matches tauri.conf.json
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  if [ "${TAG#v}" != "$conf" ]; then
                      echo "::error::Tag $TAG is not the version in src-tauri/tauri.conf.json ($conf)."
                      exit 1
                  fi
                  echo "VERSION=$conf" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com
                  scope: '@modcommunity'

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
                  key: android

            - name: Android SDK and NDK
              shell: bash
              run: |
                  sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
                  yes | "$sdkm" --licenses >/dev/null || true
                  "$sdkm" "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;35.0.0"
                  echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

            - name: Install
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

            # The version code Gradle gets is derived by Tauri from `version`
            # (major*1000000 + minor*1000 + patch) when `bundle.android.versionCode`
            # is unset, so a higher tag is always a higher code.
            - name: Generate the Android project
              shell: bash
              run: |
                  npx tauri android init --ci
                  gen=src-tauri/gen/android
                  cp -R src-tauri/icons/android/. "$gen/app/src/main/res/"
                  node scripts/mobile-patch.mjs android "$gen/app/src/main/AndroidManifest.xml"

            - name: Build
              shell: bash
              env:
                  TMC_API_BASE: ${{ vars.TMC_API_BASE }}
              run: npx tauri android build --ci --apk --aab --target aarch64 armv7 x86_64

            - name: Both schemes are in the built manifest
              shell: bash
              run: node scripts/mobile-patch.mjs check-android src-tauri/gen/android/app/src/main/AndroidManifest.xml

            # Signed here with apksigner / jarsigner rather than through a
            # Gradle signingConfig patch: it needs nothing in the generated
            # build files, so a template change in Tauri cannot break it.
            - name: Sign and collect
              shell: bash
              run: |
                  out=src-tauri/gen/android/app/build/outputs
                  apk="$(find "$out/apk" -name '*.apk' | head -1)"
                  aab="$(find "$out/bundle" -name '*.aab' | head -1)"
                  [ -n "$apk" ] || { echo "::error::No apk was built."; exit 1; }
                  bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
                  mkdir -p out
                  summary=""

                  if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
                      ks="$RUNNER_TEMP/release.jks"
                      echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
                      export KSPASS="$ANDROID_KEYSTORE_PASSWORD" KEYPASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
                      alias="$ANDROID_KEY_ALIAS"
                      summary="Signed with the release keystore (alias \`$alias\`)."
                  else
                      ks="$RUNNER_TEMP/debug.jks"
                      keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
                        -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GameSpice debug"
                      export KSPASS=android KEYPASS=android
                      alias=debug
                      summary="**DEBUG-SIGNED, not release-signed**: the ANDROID_KEYSTORE_* secrets are not set. The APK installs for testing but is signed with a throwaway key (an update signed with the real key later will not install over it), and **no .aab was produced for upload** because Google Play rejects it. See docs/RELEASING.md."
                      echo "::warning::No ANDROID_KEYSTORE_* secrets: the APK is debug-signed and the AAB is not published."
                  fi

                  "$bt/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
                  "$bt/apksigner" sign --ks "$ks" --ks-pass env:KSPASS --ks-key-alias "$alias" --key-pass env:KEYPASS \
                      --out "out/GameSpice_${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
                  "$bt/apksigner" verify "out/GameSpice_${VERSION}.apk"

                  if [ -n "$aab" ] && [ "$ks" = "$RUNNER_TEMP/release.jks" ]; then
                      cp "$aab" "out/GameSpice_${VERSION}.aab"
                      jarsigner -keystore "$ks" -storepass:env KSPASS -keypass:env KEYPASS \
                          -sigalg SHA256withRSA -digestalg SHA-256 "out/GameSpice_${VERSION}.aab" "$alias"
                  fi

                  {
                      echo "### Android ${VERSION}"
                      echo "$summary"
                      echo
                      ls -la out | sed 's/^/    /'
                  } >> "$GITHUB_STEP_SUMMARY"
                  ls -la out

            - uses: actions/upload-artifact@v4
              with:
                  name: android
                  path: out/*
                  if-no-files-found: error

    ios:
        runs-on: macos-latest
        env:
            APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
            APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
            APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            # `release-testing` is ad-hoc (installable on registered devices);
            # `app-store-connect` is for TestFlight / the App Store. A repository
            # variable switches it.
            IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
        steps:
            # An .ipa cannot be signed without the owner's Apple Developer
            # account, so without these secrets the job ends here, green, with
            # a notice rather than failing the release.
            - name: Apple credentials present?
              id: gate
              shell: bash
              run: |
                  if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
                      echo "::notice::iOS build skipped: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64 and APPLE_TEAM_ID are not all set. An Apple Developer account is required; see docs/RELEASING.md."
                      {
                          echo "### iOS"
                          echo "**Skipped**: the Apple Developer secrets are not configured, so no .ipa was built. See docs/RELEASING.md."
                      } >> "$GITHUB_STEP_SUMMARY"
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@v4
              if: steps.gate.outputs.run == 'true'
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Tag matches tauri.conf.json
              if: steps.gate.outputs.run == 'true'
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  if [ "${TAG#v}" != "$conf" ]; then
                      echo "::error::Tag $TAG is not the version in src-tauri/tauri.conf.json ($conf)."
                      exit 1
                  fi
                  echo "VERSION=$conf" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v4
              if: steps.gate.outputs.run == 'true'
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com
                  scope: '@modcommunity'

            - uses: dtolnay/rust-toolchain@master
              if: steps.gate.outputs.run == 'true'
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

            - uses: Swatinem/rust-cache@v2
              if: steps.gate.outputs.run == 'true'
              with:
                  workspaces: src-tauri
                  key: ios

            - name: Install
              if: steps.gate.outputs.run == 'true'
              run: |
                  npm ci
                  brew install xcodegen
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

            - name: Generate the iOS project
              if: steps.gate.outputs.run == 'true'
              shell: bash
              env:
                  APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  npx tauri ios init --ci
                  gen=src-tauri/gen/apple
                  # The icons (square and unrounded: Apple rounds them).
                  set="$(find "$gen" -type d -name 'AppIcon.appiconset' | head -1)"
                  [ -n "$set" ] && cp src-tauri/icons/ios/*.png "$set/"
                  plist="$(find "$gen" -maxdepth 2 -name Info.plist | head -1)"
                  node scripts/mobile-patch.mjs ios "$plist"

            # Tauri imports the certificate into a temporary keychain and
            # installs the profile itself when these three are set.
            - name: Build
              if: steps.gate.outputs.run == 'true'
              shell: bash
              env:
                  IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
                  APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
                  TMC_API_BASE: ${{ vars.TMC_API_BASE }}
              run: npx tauri ios build --ci --export-method "$IOS_EXPORT_METHOD"

            - name: Both schemes are in the built ipa
              if: steps.gate.outputs.run == 'true'
              shell: bash
              run: |
                  ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)"
                  [ -n "$ipa" ] || { echo "::error::No ipa was built."; exit 1; }
                  unzip -p "$ipa" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
                  plutil -convert xml1 "$RUNNER_TEMP/Info.plist"
                  node scripts/mobile-patch.mjs check-ios "$RUNNER_TEMP/Info.plist"
                  mkdir -p out
                  cp "$ipa" "out/GameSpice_${VERSION}.ipa"
                  {
                      echo "### iOS ${VERSION}"
                      echo "Exported with method \`$IOS_EXPORT_METHOD\`."
                  } >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@v4
              if: steps.gate.outputs.run == 'true'
              with:
                  name: ios
                  path: out/*
                  if-no-files-found: error

    # Publishes whenever the desktop build succeeded. A mobile job that failed
    # or was skipped (no Apple credentials) simply leaves its artifact out.
    publish:
        needs: [build, android, ios]
        if: ${{ !cancelled() && needs.build.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            # Pinned rather than relying on the runner image's default, since
            # `publish-release.mjs` uses `fetch` and top-level `await`.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # checksums.txt is not decoration: `scripts/install.sh` REFUSES to
            # install without it, so a release published without this step is a
            # release the one-line installer will not touch.
            #
            # The `.sig` files are excluded from it. They are not things anybody
            # installs, and a checksum of a signature is a hash of a hash.
            - name: Checksums
              working-directory: artifacts
              run: |
                  sha256sum $(ls | grep -v '\.sig$') > checksums.txt
                  cat checksums.txt

            # THE DOWNLOADS BUCKET: every file of the release under its
            # version, then the updater manifests LAST.
            #
            # The bucket is website-city's uploads bucket (`S3_*` there), and
            # the secrets carry the same names so one set of values serves
            # both. `downloads/gamespice-app/<version>/` holds the installers,
            # their `.sig` files, checksums.txt and that version's latest.json;
            # `downloads/gamespice-app/latest.json` (stable) and
            # `latest-beta.json` are the switches the app's updater reads, so
            # they are written only after everything they point at exists. A
            # pre-release tag (`v1.2.0-beta.1`) moves only the beta switch.
            #
            # THE SAME SWITCHES ARE WRITTEN UNDER `downloads/tmc-app/` TOO.
            # Builds from before the rename have that path compiled in as
            # their endpoint; it is the bridge that carries them onto the
            # GameSpice App, and stopping it strands them on their version.
            # See docs/updater.md, "Installs from before the rename".
            #
            # Skipped, loudly, without the bucket secrets: the GitHub release
            # below still happens, and the app then learns about updates from
            # the site's route instead.
            - name: Upload to the downloads bucket
              id: s3
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
                  S3_BUCKET: ${{ secrets.S3_BUCKET }}
                  S3_REGION: ${{ secrets.S3_REGION }}
                  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
                  S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE || secrets.S3_FORCE_PATH_STYLE }}
                  S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL || secrets.S3_PUBLIC_URL }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_SECRET }}
                  # Newer AWS CLIs send checksum headers several
                  # S3-compatible stores (R2, B2, MinIO builds) reject.
                  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
                  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
              run: |
                  if [ -z "${S3_BUCKET:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${S3_PUBLIC_URL:-}" ]; then
                      echo "::warning::The downloads bucket is not configured (S3_BUCKET, S3_ACCESS_KEY, S3_ACCESS_SECRET secrets and S3_PUBLIC_URL), so nothing was uploaded to it. See docs/RELEASING.md."
                      exit 0
                  fi

                  version="${TAG#v}"
                  prefix="downloads/gamespice-app"
                  legacy_prefix="downloads/tmc-app"
                  base="${S3_PUBLIC_URL%/}/${prefix}/${version}"
                  export AWS_DEFAULT_REGION="${S3_REGION:-us-east-1}"

                  s3=(aws s3)
                  if [ -n "${S3_ENDPOINT:-}" ]; then s3+=(--endpoint-url "$S3_ENDPOINT"); fi
                  if [ "${S3_FORCE_PATH_STYLE:-}" = "true" ] || [ "${S3_FORCE_PATH_STYLE:-}" = "1" ]; then
                      aws configure set default.s3.addressing_style path
                  fi

                  manifest=""
                  if ls artifacts/*.sig >/dev/null 2>&1; then
                      node scripts/updater-manifest.mjs --dir artifacts --version "$version" \
                          --base-url "$base" --out latest.json
                      cp latest.json artifacts/latest.json
                      manifest=latest.json
                  else
                      echo "::warning::This release is unsigned, so no updater manifest was written."
                  fi

                  # Versioned files never change once published.
                  "${s3[@]}" cp artifacts/ "s3://${S3_BUCKET}/${prefix}/${version}/" --recursive \
                      --cache-control "public, max-age=31536000, immutable"

                  if [ -n "$manifest" ]; then
                      for channel in beta stable; do
                          if [ "$channel" = stable ] && [[ "$version" == *-* ]]; then
                              echo "Pre-release: leaving the stable manifest alone."
                              continue
                          fi
                          name=latest.json
                          [ "$channel" = beta ] && name=latest-beta.json
                          for p in "$prefix" "$legacy_prefix"; do
                              "${s3[@]}" cp "$manifest" "s3://${S3_BUCKET}/${p}/${name}" \
                                  --content-type application/json --cache-control "no-cache, max-age=0"
                              echo "Updated ${S3_PUBLIC_URL%/}/${p}/${name}"
                          done
                      done
                  fi

                  echo "base-url=$base" >> "$GITHUB_OUTPUT"

            # THE RELEASE ALWAYS CARRIES ITS OWN MANIFESTS. `latest.json` and
            # `latest-beta.json` go on the GitHub release beside the
            # installers: they are what a build polls when no bucket is
            # configured (`releases/latest/download/latest.json`), and what
            # scripts/bridge-release.sh copies to modcommunity/tmc-app for
            # installs from before the move. With the bucket, its manifest
            # (URLs in the bucket) is reused; without it, one is written here
            # whose URLs are this release's own downloads. GitHub's
            # `releases/latest` never names a pre-release, so on this route a
            # beta-channel install sees the newest stable release.
            - name: Updater manifests on the release
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  if ! ls artifacts/*.sig >/dev/null 2>&1; then
                      echo "::warning::This release is unsigned (no TAURI_SIGNING_PRIVATE_KEY), so it carries no updater manifest and no installed app will update to it."
                      exit 0
                  fi
                  if [ ! -f artifacts/latest.json ]; then
                      node scripts/updater-manifest.mjs --dir artifacts --version "${TAG#v}" \
                          --base-url "https://github.com/${REPO}/releases/download/${TAG}" --out artifacts/latest.json
                  fi
                  cp artifacts/latest.json artifacts/latest-beta.json
                  cat artifacts/latest.json

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  prerelease=()
                  case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
                  gh release create "$TAG" --title "GameSpice App $TAG" --generate-notes --draft=false "${prerelease[@]}" \
                    || echo "release already exists, uploading into it"
                  gh release upload "$TAG" artifacts/* --clobber

            # PUBLISHING THE RELEASE TO THE SITE IS PART OF CUTTING IT.
            #
            # Without this, every release ended with somebody running a script
            # once per platform and then remembering to promote — three chances
            # to get it wrong on the one workflow where getting it wrong means
            # telling users about an update and handing them a 404.
            #
            # It runs AFTER the GitHub release exists, because the URLs it
            # publishes are that release's download URLs: sending them first
            # would name files nothing serves yet. One request carries every
            # platform and the promotion together, so the site writes them in
            # one transaction or writes none.
            #
            # It is skipped, loudly, when the secret is unset. A release that
            # was cut and not announced is a state somebody can fix in a minute;
            # a failed release job is one that has to be re-run against a tag
            # that already has artifacts on it.
            - name: Publish to the site
              shell: bash
              env:
                  TMC_RELEASE_TOKEN: ${{ secrets.TMC_RELEASE_TOKEN }}
                  TMC_SITE_URL: ${{ vars.TMC_SITE_URL }}
                  S3_BASE_URL: ${{ steps.s3.outputs.base-url }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  if [ -z "${TMC_RELEASE_TOKEN:-}" ]; then
                      echo "::warning::TMC_RELEASE_TOKEN is not set, so this release was not published to the site. Nobody is offered it until it is — run scripts/publish-release.mjs by hand, or set the secret and re-run this job."
                      exit 0
                  fi

                  if ! ls artifacts/*.sig >/dev/null 2>&1; then
                      echo "::warning::This release is unsigned, so the app cannot install it. Not publishing to the site — the version banner will still offer the download page."
                      exit 0
                  fi

                  # An ARRAY, not `${VAR:+--site "$VAR"}`. That expansion
                  # word-splits without re-interpreting the quotes, so the URL
                  # would arrive with literal quote characters around it.
                  # Unset means the production site, which is what the script
                  # defaults to. The variable exists so a fork or a staging
                  # deployment can point its own releases somewhere else.
                  site=()

                  if [ -n "${TMC_SITE_URL:-}" ]; then
                      site=(--site "$TMC_SITE_URL")
                  fi

                  # The bucket's copy when there is one — it is where the
                  # static manifest points too — else the GitHub release.
                  base="${S3_BASE_URL:-https://github.com/${{ github.repository }}/releases/download/${TAG}}"

                  # A pre-release tag (`v1.2.0-beta.1`) is published but not
                  # promoted: the site's `app.version.latest` is the stable
                  # switch, exactly as `latest.json` is in the bucket.
                  promote=(--promote)
                  case "$TAG" in *-*) promote=() ;; esac

                  node scripts/publish-release.mjs \
                      --dir artifacts \
                      --version "${TAG#v}" \
                      --base-url "$base" \
                      "${site[@]}" \
                      "${promote[@]}"
