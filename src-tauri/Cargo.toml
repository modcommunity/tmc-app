# The Tauri shell. Everything that is not "being a window" lives in `core/`,
# which has no Tauri dependency and can therefore be compiled and tested on a
# machine with no GTK/WebKit stack — see `core/src/lib.rs`.
[workspace]
members = ["core", "usvfs"]

[package]
name = "tmc-app"
version = "0.1.0"
description = "The official Modding Community app"
authors = ["The Modding Community"]
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "tmc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []

# Virtual-filesystem deployment. Forwards to `tmc-core`'s gate of the same name
# — the two halves are the deploy and the launch, and a build where only one of
# them is on could deploy a tree no launch would ever carry, or launch with an
# injector and nothing to inject. See `usvfs/src/lib.rs` for why this is off.
usvfs-hooks = ["tmc-core/usvfs-hooks"]

[dependencies]
tmc-core = { path = "core", features = ["os-keyring"] }

# No `protocol-asset`: `tauri.conf.json` disables the asset protocol, and the
# feature and the config have to agree or the build script refuses. Nothing in
# the app serves local files to the webview — images come from the CDN over
# https, and a local-file protocol would be one more thing a rendered mod
# description could try to reach.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
# No `tauri-plugin-dialog`: its folder picker is the GTK file chooser on Linux.
# Folder choosing is `components/folder-picker` over `commands::fs`.

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
# Self-updating, desktop only. Mobile updates come from a store, and a plugin
# that could replace an app's own binary there would not be allowed to.
#
# Registered ONLY when a signing public key is compiled in — see `lib.rs`. The
# plugin's entire security model is that signature check, so a build with no key
# must have no updater rather than an updater that trusts whatever it downloads.
tauri-plugin-updater = "2"

# The injector. Windows-only here — `tmc-core` depends on the same crate on
# every platform for the virtual tree, but `inject` is `#[cfg(windows)]` and
# this crate uses nothing else from it.
[target.'cfg(target_os = "windows")'.dependencies]
tmc-usvfs = { path = "usvfs" }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
