[package]
name = "tmc-usvfs"
version = "0.1.0"
description = "Virtual filesystem deployment: the merged tree, and the Windows hooks that serve it"
authors = ["The Modding Community"]
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"

[lib]
# `cdylib` so the hook half can be built as the DLL that gets injected, and
# `rlib` so the tree half can be linked into `tmc-core` like any other crate.
# One crate rather than two because the DLL and the app have to agree byte for
# byte about the shared-memory layout, and two crates agreeing about a layout is
# a thing that stops being true.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# `windows-sys` rather than `windows`: raw bindings, no COM machinery, no
# generated wrappers. This crate calls about twenty functions and every one of
# them is a plain C signature, so the ergonomics of the higher-level crate would
# be paid for in compile time and in a much larger dependency to audit.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
